<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Pixel Bakery Tycoon</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background-color: #2b211a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }
  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    background-color: #fdf6e3;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" width="960" height="540"></canvas>
</div>

<script>
/**
 * COZY PIXEL BAKERY TYCOON
 * Self-contained HTML5 Canvas 2D Pixel Art Game
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Internal logical resolution (16:9) - drawn with crisp 2px/3px pixel grid aesthetics
const GAME_WIDTH = 960;
const GAME_HEIGHT = 540;

// ==========================================
// 1. GAME CONFIGURATION & STATE
// ==========================================
const CONFIG = {
  startingMoney: 35,
  baseClickIncome: 5,
  baseCustomerIncome: 15,
  baseUpgradeCost: 50,
  upgradeCostMultiplier: 1.55,
  customerSpawnInterval: 4.5, // seconds
  maxCustomers: 3
};

const state = {
  money: CONFIG.startingMoney,
  clickIncome: CONFIG.baseClickIncome,
  customerIncome: CONFIG.baseCustomerIncome,
  ovenLevel: 1,
  recipeLevel: 1,
  ovenUpgradeCost: 50,
  recipeUpgradeCost: 75,
  
  // UI & Interaction states
  upgradeModalOpen: false,
  tutorialDismissed: false,
  hoverTarget: null, // 'kitchen', 'upgradeBtn', 'modalClose', 'upgradeOven', 'upgradeRecipe'
  
  // Animation timers
  time: 0,
  chefBounce: 0,
  chefBlinkTimer: 0,
  chefBlinking: false,
  chefKneadAnim: 0,
  upgradeBtnPress: 0,
  spawnTimer: 1.5,
  
  // Entities
  customers: [],
  floatingTexts: [],
  particles: []
};

// Interactive Hitboxes (Logical 960x540 coordinates)
const HITBOXES = {
  // Left kitchen prep table, chef, and oven area
  kitchen: { x: 15, y: 180, w: 300, h: 330 },
  // Bottom right large orange Upgrade button
  upgradeBtn: { x: 700, y: 445, w: 235, h: 72 },
  // Modal hitboxes (when open)
  modalBox: { x: 180, y: 80, w: 600, h: 380 },
  modalClose: { x: 730, y: 95, w: 36, h: 36 },
  upgradeOvenBtn: { x: 225, y: 170, w: 510, h: 110 },
  upgradeRecipeBtn: { x: 225, y: 305, w: 510, h: 110 }
};

// ==========================================
// 2. RESPONSIVE SCALING & INPUT HANDLING
// ==========================================
function resizeCanvas() {
  const container = document.getElementById('game-container');
  const cw = container.clientWidth;
  const ch = container.clientHeight;
  const targetRatio = GAME_WIDTH / GAME_HEIGHT;
  const windowRatio = cw / ch;

  let finalW, finalH;
  if (windowRatio > targetRatio) {
    finalH = ch;
    finalW = ch * targetRatio;
  } else {
    finalW = cw;
    finalH = cw / targetRatio;
  }

  canvas.style.width = `${Math.floor(finalW)}px`;
  canvas.style.height = `${Math.floor(finalH)}px`;
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function getLogicalMousePos(evt) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = GAME_WIDTH / rect.width;
  const scaleY = GAME_HEIGHT / rect.height;
  return {
    x: (evt.clientX - rect.left) * scaleX,
    y: (evt.clientY - rect.top) * scaleY
  };
}

function pointInRect(px, py, rect) {
  return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
}

canvas.addEventListener('mousemove', (e) => {
  const pos = getLogicalMousePos(e);
  state.hoverTarget = null;

  if (state.upgradeModalOpen) {
    if (pointInRect(pos.x, pos.y, HITBOXES.modalClose) || !pointInRect(pos.x, pos.y, HITBOXES.modalBox)) {
      state.hoverTarget = 'modalClose';
    } else if (pointInRect(pos.x, pos.y, HITBOXES.upgradeOvenBtn)) {
      state.hoverTarget = 'upgradeOven';
    } else if (pointInRect(pos.x, pos.y, HITBOXES.upgradeRecipeBtn)) {
      state.hoverTarget = 'upgradeRecipe';
    }
  } else {
    if (pointInRect(pos.x, pos.y, HITBOXES.upgradeBtn)) {
      state.hoverTarget = 'upgradeBtn';
    } else if (pointInRect(pos.x, pos.y, HITBOXES.kitchen)) {
      state.hoverTarget = 'kitchen';
    }
  }
});

canvas.addEventListener('mousedown', (e) => {
  const pos = getLogicalMousePos(e);

  // Handle Upgrade Modal interactions first
  if (state.upgradeModalOpen) {
    if (pointInRect(pos.x, pos.y, HITBOXES.upgradeOvenBtn)) {
      tryUpgradeOven();
      return;
    }
    if (pointInRect(pos.x, pos.y, HITBOXES.upgradeRecipeBtn)) {
      tryUpgradeRecipe();
      return;
    }
    if (pointInRect(pos.x, pos.y, HITBOXES.modalClose) || !pointInRect(pos.x, pos.y, HITBOXES.modalBox)) {
      state.upgradeModalOpen = false;
      playSound('click');
      return;
    }
    return;
  }

  // Handle Upgrade Button click
  if (pointInRect(pos.x, pos.y, HITBOXES.upgradeBtn)) {
    state.upgradeBtnPress = 0.15;
    state.upgradeModalOpen = true;
    playSound('click');
    return;
  }

  // Handle Kitchen / Baking Area click
  if (pointInRect(pos.x, pos.y, HITBOXES.kitchen)) {
    handleBakeClick(pos.x, pos.y);
  }
});

// ==========================================
// 3. SYNTHESIZED RETRO SOUND EFFECTS (Web Audio)
// ==========================================
let audioCtx = null;
function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'bake') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.start(now);
      osc.stop(now + 0.09);
    } else if (type === 'coin') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(987.77, now); // B5
      osc.frequency.setValueAtTime(1318.51, now + 0.06); // E6
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.start(now);
      osc.stop(now + 0.22);
    } else if (type === 'upgrade') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(554, now + 0.07);
      osc.frequency.setValueAtTime(659, now + 0.14);
      osc.frequency.setValueAtTime(880, now + 0.21);
      gain.gain.setValueAtTime(0.09, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === 'error') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.linearRampToValueAtTime(130, now + 0.14);
      gain.gain.setValueAtTime(0.09, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    }
  } catch (e) {
    // Ignore audio errors if blocked
  }
}

// ==========================================
// 4. GAMEPLAY LOGIC (BAKING, UPGRADES, CUSTOMERS)
// ==========================================
function handleBakeClick(x, y) {
  state.money += state.clickIncome;
  state.chefKneadAnim = 0.22;
  state.chefBounce = 4;
  playSound('bake');

  // Spawn floating +$ indicator
  spawnFloatingText(`+$${state.clickIncome}`, x, y - 15, '#ffdf4d', '#5c2c06');

  // Spawn cute flour/sparkle particles on the prep counter
  for (let i = 0; i < 6; i++) {
    state.particles.push({
      x: 115 + (Math.random() - 0.5) * 60,
      y: 382 + (Math.random() - 0.5) * 14,
      vx: (Math.random() - 0.5) * 70,
      vy: -30 - Math.random() * 50,
      life: 0.45 + Math.random() * 0.2,
      maxLife: 0.65,
      color: i % 2 === 0 ? '#fffdf5' : '#ffd166',
      size: 4
    });
  }
}

function tryUpgradeOven() {
  if (state.money >= state.ovenUpgradeCost) {
    state.money -= state.ovenUpgradeCost;
    state.ovenLevel++;
    state.clickIncome += 4 * (state.ovenLevel - 1);
    state.ovenUpgradeCost = Math.floor(state.ovenUpgradeCost * CONFIG.upgradeCostMultiplier);
    playSound('upgrade');
    spawnFloatingText(`OVEN LV.${state.ovenLevel}!`, 480, 220, '#6bf178', '#1b4332');
    spawnCelebrationParticles(480, 240);
  } else {
    playSound('error');
    spawnFloatingText('Not enough $!', 480, 220, '#ff6b6b', '#4a0e0e');
  }
}

function tryUpgradeRecipe() {
  if (state.money >= state.recipeUpgradeCost) {
    state.money -= state.recipeUpgradeCost;
    state.recipeLevel++;
    state.customerIncome += 12;
    state.clickIncome += 2;
    state.recipeUpgradeCost = Math.floor(state.recipeUpgradeCost * CONFIG.upgradeCostMultiplier);
    playSound('upgrade');
    spawnFloatingText(`RECIPE LV.${state.recipeLevel}!`, 480, 340, '#6bf178', '#1b4332');
    spawnCelebrationParticles(480, 350);
  } else {
    playSound('error');
    spawnFloatingText('Not enough $!', 480, 340, '#ff6b6b', '#4a0e0e');
  }
}

function spawnFloatingText(text, x, y, color, outline) {
  state.floatingTexts.push({
    text,
    x,
    y,
    vy: -48,
    life: 1.05,
    maxLife: 1.05,
    color,
    outline
  });
}

function spawnCelebrationParticles(cx, cy) {
  const colors = ['#ffd166', '#06d6a0', '#ff6b6b', '#ffffff'];
  for (let i = 0; i < 18; i++) {
    const angle = (Math.PI * 2 * i) / 18;
    const speed = 60 + Math.random() * 90;
    state.particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 30,
      life: 0.7,
      maxLife: 0.7,
      color: colors[i % colors.length],
      size: 6
    });
  }
}

// Customer Appearance Presets
const CUSTOMER_STYLES = [
  { hair: '#5c3a21', shirt: '#e07a5f', pants: '#3d405b', skin: '#f7c59f', hairStyle: 'bob' },
  { hair: '#2b2d42', shirt: '#81b29a', pants: '#2b2d42', skin: '#f2cc8f', hairStyle: 'short' },
  { hair: '#d4a373', shirt: '#f28482', pants: '#4a4e69', skin: '#ffcdb2', hairStyle: 'ponytail' },
  { hair: '#7f4f24', shirt: '#577590', pants: '#333d29', skin: '#e6b89c', hairStyle: 'short' }
];

const PASTRY_ICONS = ['croissant', 'cupcake', 'donut', 'bread'];

function spawnCustomer() {
  if (state.customers.length >= CONFIG.maxCustomers) return;

  // Find available queue slot in front of counter (x = 465, 535, 605)
  const slots = [465, 535, 605];
  const usedSlots = state.customers.map(c => c.targetX);
  const freeSlot = slots.find(s => !usedSlots.includes(s));
  if (freeSlot === undefined) return;

  const style = CUSTOMER_STYLES[Math.floor(Math.random() * CUSTOMER_STYLES.length)];
  const desiredPastry = PASTRY_ICONS[Math.floor(Math.random() * PASTRY_ICONS.length)];

  state.customers.push({
    x: 915, // Enter from right door
    y: 410,
    targetX: freeSlot,
    speed: 78,
    state: 'entering', // 'entering' -> 'waiting' -> 'leaving'
    waitTimer: 2.2 + Math.random() * 1.2,
    walkCycle: 0,
    style,
    desiredPastry,
    heartTimer: 0
  });
}

function update(dt) {
  state.time += dt;

  // Chef idle & blink animation
  state.chefBlinkTimer += dt;
  if (!state.chefBlinking && state.chefBlinkTimer > 3.2) {
    state.chefBlinking = true;
    state.chefBlinkTimer = 0;
  } else if (state.chefBlinking && state.chefBlinkTimer > 0.16) {
    state.chefBlinking = false;
    state.chefBlinkTimer = 0;
  }

  if (state.chefBounce > 0) {
    state.chefBounce = Math.max(0, state.chefBounce - dt * 25);
  }
  if (state.chefKneadAnim > 0) {
    state.chefKneadAnim = Math.max(0, state.chefKneadAnim - dt);
  }
  if (state.upgradeBtnPress > 0) {
    state.upgradeBtnPress = Math.max(0, state.upgradeBtnPress - dt);
  }

  // Customer spawning
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawnCustomer();
    state.spawnTimer = CONFIG.customerSpawnInterval;
  }

  // Update customers
  for (let i = state.customers.length - 1; i >= 0; i--) {
    const c = state.customers[i];
    c.walkCycle += dt * 9;

    if (c.state === 'entering') {
      c.x -= c.speed * dt;
      if (c.x <= c.targetX) {
        c.x = c.targetX;
        c.state = 'waiting';
      }
    } else if (c.state === 'waiting') {
      c.waitTimer -= dt;
      if (c.waitTimer <= 0) {
        // Customer buys pastry!
        const earned = state.customerIncome;
        state.money += earned;
        playSound('coin');
        spawnFloatingText(`+$${earned}`, c.x, c.y - 78, '#7ae582', '#134e24');
        c.state = 'leaving';
        c.heartTimer = 1.0;
      }
    } else if (c.state === 'leaving') {
      c.x += c.speed * 1.1 * dt;
      if (c.heartTimer > 0) c.heartTimer -= dt;
      if (c.x > 940) {
        state.customers.splice(i, 1);
      }
    }
  }

  // Update floating texts
  for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
    const ft = state.floatingTexts[i];
    ft.y += ft.vy * dt;
    ft.life -= dt;
    if (ft.life <= 0) {
      state.floatingTexts.splice(i, 1);
    }
  }

  // Update particles
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt; // gravity
    p.life -= dt;
    if (p.life <= 0) {
      state.particles.splice(i, 1);
    }
  }
}

// ==========================================
// 5. PIXEL ART DRAWING HELPERS
// ==========================================
const OUTLINE = '#3b2314';

function pxRect(x, y, w, h, fill, stroke = null, lineWidth = 2) {
  ctx.fillStyle = fill;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth;
    ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(w) - 1, Math.round(h) - 1);
  }
}

function pxText(text, x, y, size, fill, outline = OUTLINE, align = 'center') {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (outline) {
    ctx.fillStyle = outline;
    ctx.fillText(text, Math.round(x) - 2, Math.round(y));
    ctx.fillText(text, Math.round(x) + 2, Math.round(y));
    ctx.fillText(text, Math.round(x), Math.round(y) - 2);
    ctx.fillText(text, Math.round(x), Math.round(y) + 2);
  }
  ctx.fillStyle = fill;
  ctx.fillText(text, Math.round(x), Math.round(y));
}

// ==========================================
// 6. SCENE RENDERING (MATCHING REFERENCE)
// ==========================================
function drawBackgroundAndFloor() {
  // Cream upper walls
  pxRect(0, 0, GAME_WIDTH, 340, '#f5ebd6');

  // Ceiling trim & right perspective wall angle
  pxRect(0, 0, GAME_WIDTH, 26, '#e6d3b3', OUTLINE, 2);
  // Diagonal right ceiling beam matching reference
  ctx.fillStyle = '#e6d3b3';
  ctx.beginPath();
  ctx.moveTo(860, 0);
  ctx.lineTo(960, 0);
  ctx.lineTo(960, 75);
  ctx.lineTo(860, 26);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Decorative wall molding panels (Left Kitchen Wall)
  pxRect(140, 48, 95, 190, '#faf3e3', '#dfd0b4', 2);
  pxRect(265, 48, 120, 190, '#faf3e3', '#dfd0b4', 2);
  pxRect(405, 48, 100, 190, '#faf3e3', '#dfd0b4', 2);

  // Decorative wall molding panels (Right Cafe Wall)
  pxRect(555, 48, 130, 190, '#faf3e3', '#dfd0b4', 2);
  pxRect(715, 48, 130, 190, '#faf3e3', '#dfd0b4', 2);

  // Vertical wooden divider pillar between Kitchen and Dining Area
  pxRect(514, 24, 24, 316, '#c88a55', OUTLINE, 2);
  pxRect(517, 26, 6, 312, '#dfa36c'); // highlight

  // Wooden Wainscoting (Lower wall paneling)
  pxRect(0, 255, 865, 85, '#d59b62', OUTLINE, 2);
  for (let x = 15; x < 855; x += 48) {
    if (x > 505 && x < 540) continue;
    pxRect(x, 267, 36, 62, '#c5874e', '#9e6534', 2);
  }

  // Right angled entrance wall
  ctx.fillStyle = '#eedcc0';
  ctx.beginPath();
  ctx.moveTo(862, 26);
  ctx.lineTo(960, 75);
  ctx.lineTo(960, 375);
  ctx.lineTo(862, 340);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();

  // Right wall lower wainscoting
  ctx.fillStyle = '#c88a55';
  ctx.beginPath();
  ctx.moveTo(862, 255);
  ctx.lineTo(960, 282);
  ctx.lineTo(960, 385);
  ctx.lineTo(862, 340);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Checkered Pastel Green & Beige Floor Tiles
  const floorY = 340;
  const tileW = 48;
  const tileH = 34;
  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 21; col++) {
      const isGreen = (row + col) % 2 === 0;
      const color = isGreen ? '#b9cfb4' : '#e8dec8';
      const tx = col * tileW - (row * 6);
      const ty = floorY + row * tileH;
      pxRect(tx, ty, tileW + 1, tileH + 1, color);
    }
  }
  // Floor top baseboard border
  pxRect(0, 338, 864, 6, '#8c5830', OUTLINE, 2);
}

function drawBrickOven() {
  const ox = 12;
  const oy = 212;

  // Chimney Stack
  pxRect(ox + 34, 46, 56, 168, '#c96e4b', OUTLINE, 2);
  // Chimney brick texture
  ctx.fillStyle = '#a85334';
  for (let by = 56; by < 205; by += 18) {
    pxRect(ox + 36, by, 52, 2, '#8a3e24');
    const offset = (by / 18) % 2 === 0 ? 14 : 32;
    pxRect(ox + 36 + offset, by, 2, 18, '#8a3e24');
  }
  // Chimney lip
  pxRect(ox + 30, 44, 64, 8, '#b55b3a', OUTLINE, 2);
  pxRect(ox + 26, 206, 72, 10, '#b55b3a', OUTLINE, 2);

  // Main Oven Dome Body
  pxRect(ox, oy, 134, 152, '#c96e4b', OUTLINE, 2);
  // Rounded brick dome top
  pxRect(ox + 8, oy - 12, 118, 16, '#c96e4b', OUTLINE, 2);
  pxRect(ox + 20, oy - 20, 94, 12, '#c96e4b', OUTLINE, 2);

  // Brick lines on oven body
  for (let by = oy + 12; by < oy + 145; by += 16) {
    pxRect(ox + 2, by, 130, 2, '#8a3e24');
  }

  // Oven Arched Fire Opening
  pxRect(ox + 24, oy + 24, 86, 58, '#4a2518', OUTLINE, 2);
  pxRect(ox + 30, oy + 16, 74, 12, '#4a2518', OUTLINE, 2);
  // Arch stone border
  ctx.strokeStyle = '#9c4c30';
  ctx.lineWidth = 5;
  ctx.strokeRect(ox + 22, oy + 20, 90, 62);

  // Logs inside oven
  pxRect(ox + 38, oy + 72, 56, 8, '#6e3b1e', OUTLINE, 2);
  pxRect(ox + 44, oy + 67, 42, 7, '#854927', OUTLINE, 2);

  // Animated Glowing Fire!
  const flicker = Math.sin(state.time * 14) * 3;
  const flicker2 = Math.cos(state.time * 19) * 2.5;
  const fireBoost = Math.min(8, (state.ovenLevel - 1) * 2);

  // Outer orange flame
  ctx.fillStyle = '#ff6b1a';
  ctx.beginPath();
  ctx.moveTo(ox + 40, oy + 72);
  ctx.lineTo(ox + 50, oy + 44 - flicker - fireBoost);
  ctx.lineTo(ox + 67, oy + 32 + flicker2 - fireBoost);
  ctx.lineTo(ox + 84, oy + 45 - flicker2 - fireBoost);
  ctx.lineTo(ox + 92, oy + 72);
  ctx.closePath();
  ctx.fill();

  // Inner yellow flame
  ctx.fillStyle = '#ffd13b';
  ctx.beginPath();
  ctx.moveTo(ox + 48, oy + 72);
  ctx.lineTo(ox + 58, oy + 50 + flicker);
  ctx.lineTo(ox + 67, oy + 42 - flicker);
  ctx.lineTo(ox + 78, oy + 52 + flicker2);
  ctx.lineTo(ox + 84, oy + 72);
  ctx.closePath();
  ctx.fill();

  // Cute pixel ember sparks
  const sparkY = oy + 35 - ((state.time * 25) % 24);
  pxRect(ox + 56 + flicker, sparkY, 3, 3, '#fff3b0');
  pxRect(ox + 74 - flicker, sparkY + 6, 3, 3, '#ffd13b');

  // Oven Middle Ledge
  pxRect(ox - 4, oy + 84, 142, 10, '#d9825b', OUTLINE, 2);

  // Lower Wood Storage Cubby

function drawCustomers() {
  state.customers.forEach((c) => {
    const bob = c.state === 'waiting'
      ? Math.sin(state.time * 4 + c.targetX) * 1.5
      : Math.abs(Math.sin(c.walkCycle)) * 4;
    const x = Math.round(c.x);
    const y = Math.round(c.y - bob);

    // Shadow
    pxRect(x - 16, c.y - 2, 32, 6, 'rgba(0,0,0,0.2)');

    // Legs & Shoes
    const stride = c.state === 'waiting' ? 0 : Math.sin(c.walkCycle) * 4;
    pxRect(x - 12 + stride, y - 24, 10, 22, c.style.pants, OUTLINE, 2);
    pxRect(x + 2 - stride, y - 24, 10, 22, c.style.pants, OUTLINE, 2);

    // Shirt / Torso
    pxRect(x - 15, y - 54, 30, 32, c.style.shirt, OUTLINE, 2);

    // Chibi Head
    pxRect(x - 18, y - 88, 36, 34, c.style.skin, OUTLINE, 2);
    // Hair
    pxRect(x - 19, y - 92, 38, 12, c.style.hair, OUTLINE, 2);
    if (c.style.hairStyle === 'bob') {
      pxRect(x - 19, y - 82, 7, 22, c.style.hair, OUTLINE, 1);
      pxRect(x + 12, y - 82, 7, 22, c.style.hair, OUTLINE, 1);
    }

    // Eyes facing left toward counter (or right when leaving)
    const dir = c.state === 'leaving' ? 4 : -4;
    pxRect(x - 8 + dir, y - 74, 4, 6, '#2b1b12');
    pxRect(x + 4 + dir, y - 74, 4, 6, '#2b1b12');
    // Blush
    pxRect(x - 12 + dir, y - 66, 5, 3, '#f28482');
    pxRect(x + 8 + dir, y - 66, 5, 3, '#f28482');

    // Order Bubble when waiting at counter!
    if (c.state === 'waiting') {
      const bx = x - 20;
      const by = y - 134;
      pxRect(bx, by, 40, 34, '#ffffff', OUTLINE, 2);
      pxRect(x - 4, by + 34, 8, 5, '#ffffff', OUTLINE, 2);
      if (c.desiredPastry === 'croissant') {
        drawCroissant(x, by + 18);
      } else if (c.desiredPastry === 'cupcake') {
        drawCupcake(x, by + 22, '#ff8fab');
      } else if (c.desiredPastry === 'donut') {
        pxRect(x - 9, by + 9, 18, 16, '#ff8fab', OUTLINE, 2);
        pxRect(x - 3, by + 15, 6, 4, '#ffffff');
      } else {
        pxRect(x - 11, by + 10, 22, 14, '#e09145', OUTLINE, 2);
      }
    } else if (c.state === 'leaving' && c.heartTimer > 0) {
      // Happy heart bubble after buying!
      pxText('♥', x, y - 106, 22, '#ff4d6d', OUTLINE);
    }
  });
}

    pxText('!', btn.x + btn.w - 10, btn.y + 3 + pulse, 18, '#3b2314', null);
  }

  pxText('Upgrade', btn.x + btn.w / 2, btn.y + 34 + pressOffset, 30, '#1e1b18', null);
}

function drawUpgradeModal() {
  if (!state.upgradeModalOpen) return;

  // Dim backdrop
  ctx.fillStyle = 'rgba(28, 18, 12, 0.52)';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  const m = HITBOXES.modalBox;
  // Parchment Cream Panel with thick pixel border (matching menu.jpg reference!)
  pxRect(m.x, m.y, m.w, m.h, '#f5ebd6', OUTLINE, 6);
  pxRect(m.x + 8, m.y + 8, m.w - 16, m.h - 16, '#f5ebd6', '#d6c3a1', 3);

  // Decorative Pixel Sparkle Crosses on corners (matching menu.jpg)
  drawPixelSparkle(m.x + 88, m.y + 4);
  drawPixelSparkle(m.x + m.w - 88, m.y + m.h - 4);

  // Title: UPGRADE
  pxText('UPGRADE', m.x + m.w / 2, m.y + 46, 36, '#d99b66', '#8c5327');

  // Close 'X' button
  const cl = HITBOXES.modalClose;
  pxRect(cl.x, cl.y, cl.w, cl.h, state.hoverTarget === 'modalClose' ? '#ff6b6b' : '#e07a5f', OUTLINE, 2);
  pxText('X', cl.x + cl.w / 2, cl.y + cl.h / 2 + 1, 22, '#ffffff', OUTLINE);

  // ROW 1: OVEN UPGRADE (Increases Click Income)
  const r1 = HITBOXES.upgradeOvenBtn;
  const canAffordOven = state.money >= state.ovenUpgradeCost;
  const r1Hover = state.hoverTarget === 'upgradeOven';
  pxRect(
    r1.x, r1.y, r1.w, r1.h,
    r1Hover ? '#fffaf0' : '#efe2c6',
    canAffordOven ? '#4c9540' : '#a8967a',
    3
  );
  drawMiniOvenIcon(r1.x + 56, r1.y + 56);
  pxText(`Oven (Lv.${state.ovenLevel})`, r1.x + 120, r1.y + 38, 24, '#2b1b12', null, 'left');
  pxText(`+$${4 * state.ovenLevel} per tap`, r1.x + 120, r1.y + 72, 17, '#6e472b', null, 'left');

  // Price tag button on right
  pxRect(r1.x + 365, r1.y + 28, 125, 52, canAffordOven ? '#f45d22' : '#9aa5b1', OUTLINE, 2);
  pxText(`$${state.ovenUpgradeCost}`, r1.x + 427, r1.y + 55, 24, '#ffffff', OUTLINE);

  // ROW 2: RECIPE UPGRADE (Increases Customer Pastry Sales & Click Income)
  const r2 = HITBOXES.upgradeRecipeBtn;
  const canAffordRecipe = state.money >= state.recipeUpgradeCost;
  const r2Hover = state.hoverTarget === 'upgradeRecipe';
  pxRect(
    r2.x, r2.y, r2.w, r2.h,
    r2Hover ? '#fffaf0' : '#efe2c6',
    canAffordRecipe ? '#4c9540' : '#a8967a',
    3
  );
  drawLargeCroissantIcon(r2.x + 56, r2.y + 56);
  pxText(`Recipe (Lv.${state.recipeLevel})`, r2.x + 120, r2.y + 38, 24, '#2b1b12', null, 'left');
  pxText(`+$12/sale & +$2/tap`, r2.x + 120, r2.y + 72, 17, '#6e472b', null, 'left');

  // Price tag button on right
  pxRect(r2.x + 365, r2.y + 28, 125, 52, canAffordRecipe ? '#f45d22' : '#9aa5b1', OUTLINE, 2);
  pxText(`$${state.recipeUpgradeCost}`, r2.x + 427, r2.y + 55, 24, '#ffffff', OUTLINE);
}

function drawPixelSparkle(cx, cy) {
  pxRect(cx - 4, cy - 22, 8, 44, '#ffe885', OUTLINE, 2);
  pxRect(cx - 18, cy - 4, 36, 8, '#ffe885', OUTLINE, 2);
}

function drawMiniOvenIcon(cx, cy) {
  // Cream brick mini oven icon inspired by menu.jpg
  pxRect(cx - 32, cy - 26, 64, 54, '#f7ebd2', OUTLINE, 2);
  pxRect(cx - 35, cy - 32, 70, 8, '#d97a4a', OUTLINE, 2);
  // Chimney pipe
  pxRect(cx + 16, cy - 44, 8, 12, '#adb5bd', OUTLINE, 2);
  pxRect(cx + 16, cy - 44, 16, 6, '#adb5bd', OUTLINE, 2);
  // Arch window & cute fire
  pxRect(cx - 18, cy - 10, 36, 32, '#6c757d', OUTLINE, 2);
  pxRect(cx - 12, cy - 4, 24, 22, '#4a2518', OUTLINE, 1);
  pxRect(cx - 6, cy + 6, 12, 10, '#ff8811');
  pxRect(cx - 3, cy + 9, 6, 6, '#ffd13b');
}

function drawLargeCroissantIcon(cx, cy) {
  pxRect(cx - 28, cy - 12, 56, 26, '#e08631', OUTLINE, 2);
  pxRect(cx - 20, cy - 18, 40, 32, '#f29e44', OUTLINE, 2);
  pxRect(cx - 10, cy - 22, 20, 34, '#f9b963', OUTLINE, 2);
  pxRect(cx - 6, cy - 14, 12, 10, '#ffe0a3');
}

function drawParticlesAndFloatingTexts() {
  state.particles.forEach((p) => {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    pxRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size, p.color, OUTLINE, 1);
  });
  ctx.globalAlpha = 1;

  state.floatingTexts.forEach((ft) => {
    ctx.globalAlpha = Math.min(1, ft.life * 1.4);
    pxText(ft.text, ft.x, ft.y, 22, ft.color, ft.outline);
  });
  ctx.globalAlpha = 1;
}

// ==========================================
// 8. MAIN GAME LOOP
// ==========================================
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  update(dt);

  // Clear & Render Scene back-to-front
  ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  drawBackgroundAndFloor();
  drawKitchenFurnitureAndProps();
  drawBrickOven();
  drawCafeDiningArea();
  drawChef();
  drawPastryDisplayCounter();
  drawCustomers();
  drawHangingLights();
  drawTutorialSpeechBubble();
  drawHUD();
  drawUpgradeModal();
  drawParticlesAndFloatingTexts();

  requestAnimationFrame(gameLoop);
}

// Spawn an initial customer shortly after start so the bakery feels lively
setTimeout(spawnCustomer, 900);
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
